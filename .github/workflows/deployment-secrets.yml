name: Deployment secret regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  deployment-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # These checks do not need native application modules or live secrets.
      - run: npm ci --ignore-scripts
      - run: npm run check:deployment-secrets
      - run: npm run test:deployment-secrets
